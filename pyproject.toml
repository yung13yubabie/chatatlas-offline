[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "line-vault"
version = "0.3.1a1"
description = "Private local chat archive with a portable offline HTML reader"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
line-vault = "line_vault.__main__:main"

[tool.setuptools.package-data]
line_vault = ["web/*", "windows/*.ps1"]
