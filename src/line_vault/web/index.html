<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-@@CSP_SCRIPT@@'; style-src 'sha256-@@CSP_STYLE@@'; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer"><title>聊藏 · 知識地圖</title><style>@@STYLE@@</style></head>
<body><a class="skip" href="#content">跳到內容</a>
<header class="app-header"><div class="wordmark"><svg viewBox="0 0 34 34" aria-hidden="true"><path d="M8 9L25 7L23 26L8 22Z"/><circle cx="8" cy="9" r="4"/><circle cx="25" cy="7" r="4"/><circle cx="23" cy="26" r="4"/><circle cx="8" cy="22" r="3"/></svg><div><h1 id="app-title">聊藏</h1><span>讓對話留下脈絡</span></div></div><div class="header-note"><span id="sample-label" hidden>人工範例</span><span class="offline"><i></i>離線可用</span></div></header>
<div class="app-shell"><aside class="sidebar"><div class="sidebar-heading">我的收藏<span id="chat-count"></span></div><button id="all-chats" class="all-chats">全部聊天室</button><nav id="chats" aria-label="聊天室"></nav><div class="sidebar-bottom"><span class="tiny-map">✦</span><p>對話、人物和檔案，<br>都能在這裡重新相遇。</p></div></aside>
<main id="content"><div class="page-heading"><div><div class="eyebrow">你的對話知識庫</div><h2 id="title">知識地圖</h2><p id="coverage"></p></div><div id="stats" class="stats"></div></div>
<div class="workspace-toolbar"><div class="view-tabs" role="tablist" aria-label="閱讀方式"><button id="view-map" role="tab" aria-selected="true">關聯地圖</button><button id="view-reading" role="tab" aria-selected="false">閱讀內容</button><button id="view-files" role="tab" aria-selected="false">圖片與檔案</button></div><label class="search"><span>搜尋</span><input id="search" type="search" placeholder="搜尋主題、人物或檔名" autocomplete="off" aria-label="搜尋主題、人物或檔名"></label><details class="filter-menu"><summary>篩選</summary><div class="filter-popover"><label>範圍<select id="scope"><option value="chat">目前聊天室</option><option value="all">全部聊天室</option></select></label><label>內容<select id="kind"><option value="all">全部內容</option><option value="message">對話</option><option value="album">相簿</option><option value="note">記事本</option><option value="thread">討論串</option><option value="files">附件</option><option value="issues">待補件</option></select></label><label>開始日期<input id="since" type="date"></label><label>結束日期<input id="until" type="date"></label><label>發言者<input id="sender" placeholder="姓名或暱稱"></label><button id="clear" class="secondary">清除篩選</button></div></details></div>
<p id="notice" role="status" aria-live="polite"></p><div class="download-status"><span id="download-notice" role="status" aria-live="polite"></span><button id="cancel-download" class="secondary" hidden>停止另存</button></div>
<section id="map-section" class="map-workspace" aria-label="關聯地圖"><div class="map-area"><div class="map-caption"><span>每個連結，都能回到原文</span><span id="map-size"></span></div><svg id="knowledge-map" viewBox="0 0 1000 640" role="group" aria-label="可點選的主題、人物、內容與附件"><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#d9dfd9"/></pattern></defs><rect width="1000" height="640" fill="url(#dots)"/></svg><div id="map-empty" class="map-empty" hidden>這裡還沒有符合條件的內容。</div><div class="map-bottom"><div class="legend"><span class="topic">關鍵字</span><span class="person">人物</span><span class="source">內容</span><span class="file">附件</span></div><div class="map-controls"><button id="zoom-out" class="icon-button" aria-label="縮小地圖">−</button><button id="map-center" class="icon-button" aria-label="置中地圖">⌖</button><button id="zoom-in" class="icon-button" aria-label="放大地圖">＋</button></div></div></div><aside id="node-detail" class="detail-panel" aria-live="polite"></aside></section>
<section id="reading-section" hidden><div class="reading-heading"><h3 id="reading-label">全部內容</h3><button id="clear-node" class="secondary" hidden>顯示全部</button></div><div id="items"></div><div class="pagination"><button id="previous" class="secondary">上一頁</button><span id="page"></span><button id="next" class="secondary">下一頁</button></div></section>
<section id="files-section" hidden><div class="files-toolbar"><span>檔案已保存在這份收藏裡，可以反覆另存。</span><div><button id="save-selected" class="secondary" disabled>另存選取項目</button><span id="selected-count"></span></div></div><div id="file-grid" class="file-grid"></div><div class="pagination"><button id="file-previous" class="secondary">上一頁</button><span id="file-page"></span><button id="file-next" class="secondary">下一頁</button></div></section>
<footer><span>聊藏 · 你的離線知識庫</span><span>時間 UTC+8</span></footer></main></div>
<dialog id="preview"><button id="close-preview" class="secondary">關閉</button><div id="preview-content"></div></dialog>
<script type="application/json" id="manifest">@@MANIFEST@@</script><script>@@SCRIPT@@</script></body></html>
