name: Native source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  line-summary-export:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Standalone exporter tests with synthetic pages only
        run: python -m unittest discover -s tests -p test_line_summary_export.py
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node tools/check_public_tree.mjs
      - run: node tools/package_test.mjs
      - run: node tools/download_contract_test.cjs
      - run: node tools/capture_presentation_test.cjs
      - run: node native/tests/bridge_timing_contract.cjs
      - run: node native/tests/windows_bridge_contract.cjs
      - run: node native/tests/app_flow_contract.cjs
      - run: node native/tests/ui_dpi_contract.cjs
      - run: make -C native test build/atlas-cli
      - run: node tools/graph_model_test.cjs
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: make -C native build/atlas-cli build/reader-fixture
      - run: native/build/atlas-cli demo "$RUNNER_TEMP/chatatlas-synthetic"
      - run: native/build/atlas-cli check "$RUNNER_TEMP/chatatlas-synthetic"
      - name: Native reader regression without a language runtime dependency
        run: node tools/reader_test.cjs
      - run: node tools/graph_browser_test.cjs
        env:
          ATLAS_EXAMPLE: ${{ runner.temp }}/chatatlas-synthetic
      - name: Offline UI acceptance and screenshots
        shell: bash
        run: |
          mkdir -p "$ATLAS_QA"
          node tools/offline_ui_test.cjs 2>&1 | tee "$ATLAS_QA/test-report.txt"
        env:
          ATLAS_EXAMPLE: ${{ runner.temp }}/chatatlas-synthetic
          ATLAS_QA: ${{ runner.temp }}/chatatlas-ui-evidence
      - name: Upload artificial UI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ChatAtlas-artificial-UI-evidence
          path: ${{ runner.temp }}/chatatlas-ui-evidence/*
          if-no-files-found: warn
          retention-days: 14
  windows-native:
    env:
      ATLAS_PORTABLE: '1'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node tools/check_public_tree.mjs
      - run: node tools/package_test.mjs
      - run: node tools/download_contract_test.cjs
      - run: node tools/capture_presentation_test.cjs
      - run: node native/tests/bridge_timing_contract.cjs
      - run: node native/tests/windows_bridge_contract.cjs
      - run: node native/tests/app_flow_contract.cjs
      - run: node native/tests/ui_dpi_contract.cjs
      - name: Synthetic bridge checks, without LINE
        shell: powershell
        run: ./native/tests/windows_bridge_test.ps1
      - run: node tools/fetch_zig.mjs
      - run: node tools/windows_native_tests.mjs
      - name: Build native Windows executable
        run: node native/build.mjs
        env:
          ATLAS_ZIG: ${{ github.workspace }}/.toolchains/zig-x86_64-windows-0.14.1/zig.exe
      - run: node native/tests/no_install_contract.cjs native/out/ChatAtlas.exe
      - name: No developer tools runtime smoke test
        shell: powershell
        run: ./native/tests/no_install_runtime.ps1 -Exe native/out/ChatAtlas.exe
