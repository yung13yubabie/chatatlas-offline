name: Build native Windows alpha candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python tools/check_public_tree.py
      - run: make -C native test
      - run: node tools/graph_model_test.cjs
      - run: python tools/fetch_zig.py
      - run: node native/build.mjs
        env:
          ATLAS_ZIG: ${{ github.workspace }}/.toolchains/zig-x86_64-linux-0.14.1/zig
      - run: python tools/package_release.py --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ChatAtlas-alpha-candidate-NOT-security-approved
          path: dist/*
          retention-days: 14
