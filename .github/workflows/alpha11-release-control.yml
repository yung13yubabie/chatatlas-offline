name: Stop superseded alpha.11 build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/alpha11-release-control.yml']
permissions:
  actions: write
jobs:
  stop-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop build before publishing the superseded source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/actions/runs/40918838769/cancel"
