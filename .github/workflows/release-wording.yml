name: Refresh release wording
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths: ['.github/workflows/release-wording.yml']
permissions:
  contents: read
jobs:
  refresh-descriptions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Update published descriptions and verify existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          const repo=process.env.GITHUB_REPOSITORY;
          if(repo!=='yung13yubabie/chatatlas-offline')throw Error('Unexpected repository');
          const tags=new Set(['v0.3.1-alpha.8','v0.3.1-alpha.9','v0.3.1-alpha.10']);
          function github(args,input){
            const result=spawnSync('gh',['api',...args],{encoding:'utf8',input,maxBuffer:4*1024*1024});
            if(result.error||result.status!==0)throw Error('Release description request failed');
            return JSON.parse(result.stdout);
          }
          function rewritten(body){
            return body
              .replace(/^原生 Windows x64 預覽版：直接唯讀連接選定的 LINE 本機資料庫，.*$/m,'原生 Windows x64 預覽版：直接唯讀連接選定的 LINE 本機資料庫，並嘗試自動下載圖片、影片與檔案。')
              .replaceAll('已接上原生 OBS／LEG Y 授權與已知 E2EE 媒體解密流程。','');
          }
          function identity(release){
            return JSON.stringify({
              id:release.id,name:release.name,tag:release.tag_name,target:release.target_commitish,
              draft:release.draft,prerelease:release.prerelease,published:release.published_at,
              assets:release.assets.map(a=>({id:a.id,name:a.name,size:a.size,digest:a.digest,url:a.browser_download_url})).sort((a,b)=>a.id-b.id)
            });
          }
          for(const tag of tags){
            const endpoint='repos/'+repo+'/releases/tags/'+tag;
            const before=github([endpoint]);
            if(before.draft||!before.body)throw Error('Expected a published release description');
            const body=rewritten(before.body);
            if(before.body.includes('真實 LINE 帳號仍需實機驗證')&&!body.includes('真實 LINE 帳號仍需實機驗證'))throw Error('Compatibility statement missing');
            if(body===before.body){console.log('Already current: '+tag);continue;}
            const payload=JSON.stringify({body});
            github(['--method','PATCH','repos/'+repo+'/releases/'+before.id,'-H','Content-Type: application/json','--input','-'],payload);
            const after=github([endpoint]);
            if(after.body!==body||identity(after)!==identity(before))throw Error('Release description readback differs');
            console.log('Updated description; assets and release identity verified: '+tag);
          }
          NODE
